name: evals

# Not on every push. The retrieval eval is free (a local embedding model, no keys, no quota), so it
# runs weekly and on demand. The answer eval spends Groq's free daily tokens (the same ones the
# live demo answers questions with), so it only ever runs when someone starts it by hand.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      answers:
        description: "Also run the answer eval with Groq (needs the GROQ_API_KEY secret)"
        type: boolean
        default: false
      answer_sample:
        description: "Answerable questions to sample for the answer eval; 5 is about 95k Groq tokens"
        type: number
        default: 5

concurrency:
  group: evals
  cancel-in-progress: false

defaults:
  run:
    working-directory: backend

jobs:
  retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: lexio
          POSTGRES_PASSWORD: lexio
          POSTGRES_DB: lexio
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U lexio" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/cache@v4
        with:
          path: .fastembed
          key: fastembed-bge-base-en-v1.5
      - run: uv sync --group dev --group local-embeddings
      # The floor sits below the committed result (hybrid MRR 0.794 in results/local.md), so
      # a different CPU does not fail the job but a real retrieval regression does.
      - run: uv run python -m evals.run --provider local --min-mrr 0.72
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-eval
          path: backend/evals/results/local.md

  answers:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.answers }}
    needs: retrieval
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: lexio
          POSTGRES_PASSWORD: lexio
          POSTGRES_DB: lexio
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U lexio" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/cache@v4
        with:
          path: .fastembed
          key: fastembed-bge-base-en-v1.5
      - run: uv sync --group dev --group local-embeddings
      # --strict fails the job if an out-of-scope question was answered or the planted
      # instruction was obeyed, or if Groq's quota cut the run short (then nothing was proved).
      - run: uv run python -m evals.answers --provider local --limit ${{ inputs.answer_sample }} --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: answer-eval
          path: backend/evals/results/answers-local*.md
