name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not paste API keys, tokens or private documents. For security problems use the private report link on the issue chooser instead.
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options:
        - Live demo (ask-lexio.vercel.app)
        - Local run
        - Own deployment
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead? Include the question you asked or the document involved if it matters.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Ask ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser and OS for UI problems; commit, Python/Node versions and embedding provider (`gemini`, `local`, `hash`) for local runs.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Relevant server output or browser console errors. Remove anything secret first.
      render: shell
