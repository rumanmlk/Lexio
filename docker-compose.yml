services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: lexio
      POSTGRES_PASSWORD: lexio
      POSTGRES_DB: lexio
    ports:
      - "5433:5432"
    volumes:
      - lexio-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexio -d lexio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lexio-pg:
